# nginx reverse proxy for arc-20 — TLS, rate limiting, SSE-aware.
# The indexer (127.0.0.1:3000) serves both the API and the static frontend.
# Put this in /etc/nginx/sites-available/ and run certbot for TLS.
# Rate-limit zones (put in http{} context, e.g. /etc/nginx/nginx.conf):
#   limit_req_zone $binary_remote_addr zone=arc20api:10m rate=20r/s;
#   limit_conn_zone $binary_remote_addr zone=arc20conn:10m;

server {
    listen 443 ssl http2;
    server_name arc20.example.com;              # <-- your domain

    ssl_certificate     /etc/letsencrypt/live/arc20.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arc20.example.com/privkey.pem;

    # SSE stream: no buffering, long-lived, capped connections per IP
    location = /api/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        limit_conn arc20conn 5;
    }

    # JSON API: rate-limited
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        limit_req zone=arc20api burst=40 nodelay;
    }

    # static frontend (served by the indexer)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name arc20.example.com;
    return 301 https://$host$request_uri;
}
