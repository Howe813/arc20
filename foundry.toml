[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.35"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
# Arc (Circle) mainnet — chain ID 5042, native gas token USDC (18 decimals).
# Set ARC_RPC to a keyed/private endpoint for deployments; the public RPC works too.
arc = "${ARC_RPC}"
# Arc testnet — chain ID 5042002, faucet: https://faucet.circle.com
arc_testnet = "https://rpc.testnet.arc.io"

[etherscan]
# Arc explorer (explorer.arc.io). If verification against the Blockscout-style API
# fails, check the exact /api flavor Circle's explorer exposes and adjust url/verifier.
arc = { key = "${ARC_EXPLORER_KEY}", chain = 5042, url = "https://explorer.arc.io/api" }
arc_testnet = { key = "${ARC_EXPLORER_KEY}", chain = 5042002, url = "https://explorer.testnet.arc.io/api" }
